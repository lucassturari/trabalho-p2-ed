<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Simulador Visual - Quick Sort vs Merge Sort (Fatec)</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
    <h1>🚀 Simulador: Quick Sort vs. Merge Sort</h1>
    
    <div class="controls">
        <button onclick="mudarAlgoritmo('quicksort')">Alternar para: Quick Sort</button>
        <button onclick="mudarAlgoritmo('mergesort')" class="secondary">Alternar para: Merge Sort</button>
    </div>

    <div class="metrics">
        <div>Algoritmo Atual: <span id="lbl-algo">Quick Sort</span></div>
        <div>Comparações: <span id="lbl-comp">0</span></div>
        <div>Trocas/Movimentos: <span id="lbl-trocas">0</span></div>
    </div>

    <div class="canvas-container" id="canvas"></div>

    <div class="controls">
        <button onclick="carregarCaso('comum')">Caso Comum</button>
        <button onclick="carregarCaso('pior')" class="secondary">Pior Caso O(n²)</button>
        <button onclick="executarPasso()">Próximo Passo (Step)</button>
        <button onclick="reiniciar()">Reiniciar</button>
    </div>

    <h3>Log de Execução:</h3>
    <div class="log-box" id="log">Simulador pronto. Escolha um cenário e clique em Próximo Passo.</div>
</div>

<script src="app.js"></script>
</body>
</html>
